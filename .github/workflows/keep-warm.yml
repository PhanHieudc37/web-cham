name: Keep production function warm
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Public health probe
        env:
          CHECK_DB: ${{ (github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: |
          node --input-type=module <<'JS'
          const suffix = process.env.CHECK_DB === "1" ? "?db=1" : "";
          const response = await fetch("https://chamstu.netlify.app/api/health" + suffix, { signal: AbortSignal.timeout(30000), redirect: "error" });
          const health = await response.json();
          if (!response.ok || !health.ok) throw new Error("Health probe failed");
          console.log(JSON.stringify({ ok: health.ok, commit: health.commit, checkedDatabase: Boolean(suffix) }));
          JS
