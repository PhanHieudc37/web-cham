name: Publish design preview

on:
  push:
    branches: [main]
    paths: ["preview/**", "scripts/*preview*.mjs", "package.json", "package-lock.json", "src/app/icon.svg", ".github/workflows/preview-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .preview-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy design preview
        id: deployment
        uses: actions/deploy-pages@v4
